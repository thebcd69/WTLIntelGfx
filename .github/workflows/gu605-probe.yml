# GU605 branch: a 10-second job on Linux, to tell "no macOS runner for this account" from a broken workflow.
name: gu605-probe
on:
  push:
    branches: [gu605-mtl]
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: uname -a; date -u
  # whether the hosted macOS image gu605.yml uses picks up jobs for this account (2026-11-09: macos-14 retired;
  # macos-15 and macos-15-intel jobs sat queued while macos-26 and macos-latest ran at once)
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - run: sw_vers; uname -m; ls -d /Applications/Xcode*.app; date -u
