# GU605 branch: a 10-second job on Linux, to tell "no macOS runner for this account" from a broken workflow.
name: gu605-probe
on:
  push:
    branches: [gu605-mtl]
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: uname -a; date -u
  # which hosted macOS images pick up jobs for this account (2026-11-09: macos-14 retired, macos-15 jobs sat queued)
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - run: sw_vers; uname -m; ls -d /Applications/Xcode*.app; date -u
