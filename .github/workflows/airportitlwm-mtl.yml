# airportitlwm-mtl.yml (gu605-mac, 2026-11-13): native Wi-Fi for the GU605's Meteor Lake CNVi (8086:7E40, MA-B0 + AX211).
# laobamac/itlwm's AirportItlwm-Sequoia (7204c69) has no Meteor Lake support at all: it asks for a firmware file that
# no tree carries ("iwlwifi-ma-a0-gf-a0-63.ucode resource load fail", read from the driver's own log on 2026-11-13).
# The owner's itlwm port (thebcd69/itlwm branch mtl, ac15a19: -89 firmware, fragmented PNVM, MLD firmware API) works
# on this hardware with HeliPort. gu605/wifi/airportitlwm-mtl.patch is that branch merged into laobamac 7204c69
# (conflicts resolved by hand, see the patch's ItlIwx.cpp hunks marked MTL). The two firmware images are the ones
# inside the owner's working itlwm.kext (gu605/wifi/firmware, sha256 below).
# Publishes prerelease airportitlwm-mtl-<sha>. Runs on a push that changes this file or the patch.
name: airportitlwm-mtl
on:
  push:
    branches: [gu605-mac]
    paths: ['.github/workflows/airportitlwm-mtl.yml', 'gu605/wifi/**']
permissions:
  contents: write
env:
  UCODE_SHA: 83c358a33c66bd41f753ee8e0e4fff5c9741694a397ac13a61e851e6bcf5dd6b
  PNVM_SHA: 65ccc7ed05c0ecb3ea0374b607ecacfdc693df4e5cbf825a4c91f71ce8fa9b7b
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: laobamac/itlwm
          ref: 7204c69d1bfa7f5cc0f7864e08fb03e55d0ec29e
          path: itlwm
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: itlwm/MacKernelSDK
      - name: Meteor Lake port (thebcd69/itlwm mtl merged into laobamac main)
        run: |
          set -euo pipefail
          git -C itlwm apply --index ../gu605/wifi/airportitlwm-mtl.patch
          git -C itlwm diff --cached --stat | tail -12
      - name: Firmware (the two images of the working itlwm.kext, kept in gu605/wifi/firmware)
        run: |
          set -euo pipefail
          # linux-firmware's -89 file changed after the port was tested (2026-11-13: 1753076 bytes there, 1752976 in the
          # owner's working kext), so the images proven on this hardware are kept in the repository (Intel's licence
          # beside them) and checked here
          cd gu605/wifi/firmware
          echo "$UCODE_SHA  iwlwifi-ma-b0-gf-a0-89.ucode" | shasum -a 256 -c
          echo "$PNVM_SHA  iwlwifi-ma-b0-gf-a0.pnvm" | shasum -a 256 -c
          cp iwlwifi-ma-b0-gf-a0-89.ucode iwlwifi-ma-b0-gf-a0.pnvm "$GITHUB_WORKSPACE/itlwm/itlwm/firmware/"
          rm -f "$GITHUB_WORKSPACE/itlwm/include/FwBinary.cpp"
          ls -la "$GITHUB_WORKSPACE/itlwm/itlwm/firmware/" | grep -i ma-
      - name: Firmware TLV dump
        run: python3 -I itlwm/scripts/iwx_fw_info.py itlwm/itlwm/firmware/iwlwifi-ma-b0-gf-a0-89.ucode itlwm/itlwm/firmware/iwlwifi-ma-b0-gf-a0.pnvm | head -60
      - name: Build AirportItlwm-Sequoia
        run: |
          set -euo pipefail
          cd itlwm
          for c in Debug Release; do
            xcodebuild -project itlwm.xcodeproj -scheme AirportItlwm-Sequoia -configuration $c -jobs 3 ARCHS=x86_64 \
              SYMROOT="$PWD/build/products" OBJROOT="$PWD/build/obj" CODE_SIGNING_ALLOWED=NO \
              GIT_COMMIT="_$(git rev-parse --short HEAD)-mtl" build > ../build-$c.log 2>&1 || { grep -nE 'error:|Undefined symbols|ld: ' ../build-$c.log | head -60; tail -30 ../build-$c.log; exit 1; }
            grep -cE 'warning:' ../build-$c.log || true
            K=$(find build/products -path "*$c*" -name AirportItlwm.kext -maxdepth 3 | head -1); echo "$K"
            B="$K/Contents/MacOS/AirportItlwm"
            # nothing the kernel does not export (strnstr stopped a build at link time on 2026-11-13)
            if nm -u "$B" | grep -E '_strnstr$|_strstr$'; then echo "unexported libc symbol"; exit 1; fi
            strings -a "$B" | grep -E '^iwlwifi-ma-b0' | sort -u
            mkdir -p ../out && ditto -c -k --keepParent "$K" ../out/AirportItlwm-Sequoia-mtl-$c.zip
          done
          (cd ../out && shasum -a 256 *.zip > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: build-*.log
      - name: Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=airportitlwm-mtl-$(git rev-parse --short HEAD)
          gh release create "$T" out/*.zip out/SHA256SUMS --prerelease --target "$(git rev-parse HEAD)" \
            --title "$T (AirportItlwm-Sequoia, Meteor Lake 8086:7E40)" \
            --notes "AirportItlwm-Sequoia: laobamac/itlwm 7204c69 + thebcd69/itlwm mtl ac15a19 (Meteor Lake MA-B0 + AX211, -89 firmware, MLD API). Log: sysctl -b debug.itlwm_log. Test build for the GU605."
